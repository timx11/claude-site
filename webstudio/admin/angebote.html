<!DOCTYPE html>
<html lang="de">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <meta name="robots" content="noindex, nofollow" />
  <title>Angebote — Tim-Ulrich-Webstudio</title>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&family=Fraunces:opsz,wght@9..144,500..800&family=JetBrains+Mono:wght@400;500;700&display=swap" />
  <link rel="stylesheet" href="admin-shared.css" />
  <link rel="stylesheet" href="osapp.css" />
</head>
<body class="osapp">

<div id="ad-topnav-mount"></div>

<main class="osapp-page">

  <header class="osapp-header">
    <div>
      <span class="osapp-kicker">◉ Angebote</span>
      <h1 class="osapp-title">Deine drei <em>Pakete</em></h1>
      <p class="osapp-sub">Editiere Name, Preis und Inhalte. Wird lokal gespeichert.</p>
    </div>
    <div class="osapp-actions">
      <button class="osapp-btn osapp-btn-ghost" onclick="resetDefaults()">↺ Standard</button>
      <button class="osapp-btn osapp-btn-primary" onclick="window.print()">🖨 Drucken</button>
    </div>
  </header>

  <div id="offers" class="offer-grid"></div>

  <section class="osapp-card osapp-tip">
    <span class="osapp-tip-icon">💡</span>
    <div>
      <strong>So nutzt Du das hier:</strong>
      Pflege Deine Standard-Pakete und Preise, damit Du sie im Termin sofort
      zeigen kannst. Klick auf jedes Feld — es ist direkt editierbar. Speichern
      passiert automatisch.
    </div>
  </section>
</main>

<script src="admin-shared.js"></script>
<script src="angebote.js"></script>
</body>
</html>

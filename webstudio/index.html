<!DOCTYPE html>
<html lang="de">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Tim-Ulrich-Studio — 3D-Erlebnis</title>
  <meta name="description" content="Schau ins Studio von Tim Ulrich. 3D-Erlebnis mit anklickbarem PC und Desktop." />
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&family=JetBrains+Mono:wght@400;500;700&display=swap" />
  <link rel="stylesheet" href="desktop.css" />

  <!-- Three.js — lokal eingebunden (kein CDN, läuft offline) -->
  <script type="importmap">
  {
    "imports": {
      "three": "./vendor/three/three.module.js"
    }
  }
  </script>
</head>
<body>

<!-- ─── 3D-Szene Canvas ─── -->
<div id="scene-wrap">
  <canvas id="scene"></canvas>

  <!-- Subtile UI über der Szene -->
  <div class="scene-ui scene-ui-top">
    <a href="klassisch.html" class="scene-back">Klassische Verkaufsseite →</a>
    <div class="scene-brand">
      <span class="scene-brand-mark">TU</span>
      <span class="scene-brand-text">
        <span class="scene-brand-name">Tim-Ulrich-Studio</span>
        <span class="scene-brand-sub">Duisburg-Serm · 3D-Experience</span>
      </span>
    </div>
    <button class="scene-sound" id="sound-toggle" title="Sound an/aus">🔊</button>
  </div>

  <div class="scene-ui scene-ui-bottom">
    <div class="hint" id="scene-hint">
      <span class="hint-dot"></span>
      Klick auf den <strong>Monitor</strong> · der PC fährt hoch
    </div>
  </div>

  <!-- Lade-Overlay -->
  <div class="loader" id="loader">
    <div class="loader-mark">TU</div>
    <div class="loader-text">Studio lädt&hellip;</div>
    <div class="loader-bar"><div></div></div>
  </div>

  <!-- Power-On-Flash beim Reinzoomen -->
  <div class="power-flash" id="power-flash"></div>
</div>

<!-- ─── Desktop-OS (kommt nach Klick) ─── -->
<div id="os" class="os" aria-hidden="true">

  <!-- Wallpaper -->
  <div class="os-wallpaper"></div>

  <!-- Top-Bar -->
  <div class="os-topbar">
    <div class="os-topbar-left">
      <span class="os-logo">◉ Tim-Ulrich-OS</span>
      <span class="os-menu">Datei</span>
      <span class="os-menu">Bearbeiten</span>
      <span class="os-menu">Ansicht</span>
      <span class="os-menu">Hilfe</span>
    </div>
    <div class="os-topbar-right">
      <span class="os-status" id="os-clock">--:--</span>
      <span class="os-status">📡</span>
      <span class="os-status">🔋 87%</span>
      <button class="os-exit" id="os-exit" title="OS verlassen">⏻ Exit</button>
    </div>
  </div>

  <!-- Desktop-Icons -->
  <div class="os-desktop" id="os-desktop">
    <!-- gefüllt von JS -->
  </div>

  <!-- Fenster-Bühne -->
  <div class="os-windows" id="os-windows">
    <!-- Fenster werden hier dynamisch eingehängt -->
  </div>

  <!-- Taskbar unten -->
  <div class="os-taskbar">
    <div class="os-taskbar-left">
      <button class="os-start">
        <span class="os-start-dot"></span>
        Start
      </button>
    </div>
    <div class="os-taskbar-mid" id="os-taskbar-mid">
      <!-- offene Fenster -->
    </div>
    <div class="os-taskbar-right">
      <span class="os-taskbar-status">Tim-Ulrich-OS v1.0 · Duisburg-Serm</span>
    </div>
  </div>

  <!-- Boot-Screen, kurz beim Eintreten -->
  <div class="os-boot" id="os-boot">
    <div class="os-boot-mark">TU</div>
    <div class="os-boot-line">Tim-Ulrich-OS · Booting&hellip;</div>
    <div class="os-boot-log" id="os-boot-log"></div>
  </div>
</div>

<script type="module" src="desktop.js"></script>
</body>
</html>
